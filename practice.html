<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPilot AI | Practice</title><link rel="stylesheet" href="practice.css"></head>
<body><nav><a class="logo" href="main.html">CodeSprint <span>AI</span></a><a href="dashboard.html">Dashboard</a></nav><main><header><span>04 • AI PRACTICE</span><h1>Practice. Learn. <b>Improve.</b></h1><p>Questions are created from the analyzed concepts in your uploaded material.</p></header><section class="card" id="quiz"><button class="primary" onclick="start()">Start Practice Test</button></section></main>
<script>
const K='studypilot_ai_data',d=JSON.parse(localStorage.getItem(K)||'{}');let qs=d.questions||[];if(!qs.length)qs=(d.analysis?.importantTopics||[]).slice(0,10).map((t,i)=>({id:i+1,type:'MCQ',topic:t,question:`Which statement best describes the importance of ${t}?`,options:[`It is an important concept identified in the material`,`It is unrelated to the material`,`It should always be skipped`,`It has no practical use`],answer:0,explanation:`${t} was identified as a significant concept in your uploaded material.`}));
let i=0,score=0,attempted=0,results=[];function start(){i=0;score=0;attempted=0;render()}function render(){if(i>=qs.length){finish();return}const q=qs[i];document.getElementById('quiz').innerHTML=`<div class="top">Question ${i+1} of ${qs.length}<span>Score: ${score}</span></div><div class="progress"><i style="width:${(i/qs.length)*100}%"></i></div><small>${esc(q.topic||'Concept')}</small><h2>${esc(q.question)}</h2>${q.options.map((o,n)=>`<button class="option" onclick="answer(${n})">${String.fromCharCode(65+n)}. ${esc(o)}</button>`).join('')}`};function answer(n){const q=qs[i],correct=n===q.answer;attempted++;if(correct)score++;results.push({question:q.question,topic:q.topic,correct,selected:n,answer:q.answer});document.getElementById('quiz').innerHTML=`<div class="${correct?'good':'bad'}"><h2>${correct?'Correct ✓':'Not quite'}</h2><p>${esc(q.explanation||'Review this concept in your material.')}</p><button class="primary" onclick="i++;render()">Next →</button></div>`}
function finish(){const old=d.practice||{attempted:0,correct:0,wrong:0,accuracy:0,tests:[],mistakes:[]};old.attempted+=attempted;old.correct+=score;old.wrong+=attempted-score;old.accuracy=Math.round(old.correct/old.attempted*100)||0;results.filter(x=>!x.correct).forEach(x=>old.mistakes.push(x));old.tests.push({date:new Date().toISOString(),score,total:qs.length,accuracy:Math.round(score/qs.length*100)});d.practice=old;localStorage.setItem(K,JSON.stringify(d));document.getElementById('quiz').innerHTML=`<h2>Practice complete 🎉</h2><div class="score">${Math.round(score/qs.length*100)}%</div><p>${score} correct out of ${qs.length}. Your overall accuracy is ${old.accuracy}%.</p><button class="primary" onclick="location.href='progress.html'">See Track & Improve →</button>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
