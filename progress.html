<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPilot AI | Progress</title><link rel="stylesheet" href="progress.css"></head>
<body><nav><a class="logo" href="main.html">CodeSprint <span>AI</span></a><a href="dashboard.html">Dashboard</a></nav><main><header><span>05 • TRACK & IMPROVE</span><h1>See your <b>progress</b></h1><p>StudyPilot turns your test history and mistakes into actionable feedback.</p></header><div class="stats"><div><b id="accuracy">0%</b><span>Accuracy</span></div><div><b id="attempted">0</b><span>Questions</span></div><div><b id="correct">0</b><span>Correct</span></div><div><b id="improve">0%</b><span>Improvement</span></div></div><section class="card"><small>WEAK AREAS</small><h2>Where you should improve</h2><div id="weak"></div></section><section class="card"><small>MISTAKE REVIEW</small><h2>Recent mistakes</h2><div id="mistakes"></div></section><div class="actions"><button onclick="location.href='practice.html'">Practice Again</button><button class="primary" onclick="location.href='masterexam.html'">Generate Master Exam →</button></div></main>
<script>
const d=JSON.parse(localStorage.getItem('studypilot_ai_data')||'{}'),p=d.practice||{};accuracy.textContent=(p.accuracy||0)+'%';attempted.textContent=p.attempted||0;correct.textContent=p.correct||0;improve.textContent=((p.improvement||0)>=0?'+':'')+(p.improvement||0)+'%';
const counts={};(p.mistakes||[]).forEach(x=>counts[x.topic||'Unknown']=(counts[x.topic||'Unknown']||0)+1);weak.innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><b>${esc(x[0])}</b><span>${x[1]} mistake${x[1]>1?'s':''}</span></div>`).join('')||'<p>No mistakes recorded yet. Great start!</p>';mistakes.innerHTML=(p.mistakes||[]).slice(-8).reverse().map(x=>`<div class="mistake"><b>${esc(x.topic||'Topic')}</b><p>${esc(x.question)}</p></div>`).join('')||'<p>No mistakes to review.</p>';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
